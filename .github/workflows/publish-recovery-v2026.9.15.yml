name: Publish Arabic v2026.9.17

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-recovery-v2026.9.15.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from verified working v2026.9.13 with English menu fallback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-working-arabic-v2026.9.13
          git show origin/backup-working-arabic-v2026.9.13:translation_ar.zip > /tmp/backup-9.13.zip

          rm -rf /tmp/ar917
          mkdir -p /tmp/ar917
          python - <<'PY'
          import json, re, zipfile
          from pathlib import Path

          src = Path('/tmp/backup-9.13.zip')
          work = Path('/tmp/ar917')
          out = Path('v3/translation_ar.zip')
          out.parent.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(src, 'r') as z:
              z.extractall(work)

          mod = work / 'translation_ar'
          ar_path = mod / 'ar.rpym'
          text = ar_path.read_text(encoding='utf-8')

          # These strings use game/menu styles that do not render Arabic glyphs on Android.
          # Keep the rest of the game Arabic; only force these proven-broken UI labels to English.
          fallbacks = {
              'Continue': 'Continue',
              'New game': 'New game',
              'New Game': 'New Game',
              'Load': 'Load',
              'Settings': 'Settings',
              'Gallery': 'Gallery',
              'Help': 'Help',
              'Mods': 'Mods',
              'Customization': 'Customization',
              'Back': 'Back',
          }

          def replace_translation_block(src_text, old, new):
              # Replace only the translated value paired with the exact old string.
              pat = re.compile(
                  r'(\n\s*old\s+"' + re.escape(old) + r'"\s*\n\s*new\s+")([^"\n]*)(")'
              )
              updated, count = pat.subn(lambda m: m.group(1) + new + m.group(3), src_text)
              return updated, count

          counts = {}
          for old, new in fallbacks.items():
              text, count = replace_translation_block(text, old, new)
              counts[old] = count

          # Add fallback entries only when the source did not already contain that key.
          missing = [k for k, c in counts.items() if c == 0]
          if missing:
              extra = ['\n# English fallback for Arabic-unsupported menu styles.', 'translate ar strings:']
              for key in missing:
                  extra += [f'    old {json.dumps(key)}', f'    new {json.dumps(fallbacks[key])}', '']
              text += '\n'.join(extra) + '\n'

          ar_path.write_text(text, encoding='utf-8')

          # Keep only the proven v2026.9.13 RTL/font layer. Do not add risky navigation style overrides.
          inner_path = mod / 'manifest.json'
          inner = json.loads(inner_path.read_text(encoding='utf-8'))
          inner['version'] = '2026.9.17'
          inner['description'] = 'Verified v2026.9.13 Arabic base. Main-menu labels that render as squares now fall back to English; all working Arabic text remains Arabic.'
          inner_path.write_text(json.dumps(inner, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for p in sorted(mod.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(work).as_posix())

          outer = {
              'name': 'Kunoichi Trainer Arabic v3',
              'mods': [{
                  'id': 'translation_ar',
                  'name': 'Translation: Arabic (100%)',
                  'version': '2026.9.17',
                  'description': 'Stable v2026.9.13 Arabic base with English fallback only for menu labels that display as squares on Android.',
                  'game_version': '0.32.1',
                  'no_reload': True,
                  'image': 'https://flagcdn.com/w640/eg.webp',
                  'language': 'Arabic',
                  'language_code': 'ar',
                  'file_name': 'translation_ar.zip'
              }]
          }
          Path('v3/manifest.json').write_text(json.dumps(outer, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          # Sanity checks.
          with zipfile.ZipFile(out, 'r') as z:
              names = set(z.namelist())
              assert 'translation_ar/ar.rpym' in names
              assert 'translation_ar/config.rpym' in names
              assert 'translation_ar/lang_name.rpym' in names
              assert 'translation_ar/manifest.json' in names
              final_ar = z.read('translation_ar/ar.rpym').decode('utf-8')
              for key, val in fallbacks.items():
                  assert f'old "{key}"' in final_ar
          print('Patched translation counts:', counts)
          PY

      - name: Commit v3 package and fresh source URL
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/manifest.json v3/translation_ar.zip
          git commit -m "Publish Arabic v2026.9.17 English menu fallback"
          git pull --rebase origin main
          git push origin HEAD:main
